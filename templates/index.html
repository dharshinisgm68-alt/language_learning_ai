```html
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Language Learning AI</title>

<link rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="app">

<header>
    <div>
        <h1>🌐 Language Learning AI</h1>
        <p>Learn • Practice • Improve</p>
    </div>
</header>


<!-- Learning Profile -->

<section id="profilePanel" class="panel">

    <h2>🎯 Learning Profile</h2>

    <select id="language">

        <option value="English">English</option>
        <option value="Tamil">Tamil</option>
        <option value="Hindi">Hindi</option>
        <option value="Malayalam">Malayalam</option>
        <option value="Telugu">Telugu</option>
        <option value="Kannada">Kannada</option>

    </select>


    <select id="level">

        <option value="Beginner">Beginner</option>
        <option value="Intermediate">Intermediate</option>
        <option value="Advanced">Advanced</option>

    </select>


    <button onclick="saveProfile()">
        Save Profile
    </button>

</section>


<main>

<!-- Feature Toolbar -->

<section class="toolbar">

    <button onclick="setFeature('Conversation')">
        💬 Conversation
    </button>

    <button onclick="setFeature('Vocabulary')">
        📖 Vocabulary
    </button>

    <button onclick="setFeature('Grammar')">
        📝 Grammar
    </button>

    <button onclick="setFeature('Translation')">
        🌍 Translation
    </button>

    <button onclick="setFeature('Pronunciation')">
        🔊 Pronunciation
    </button>

    <button onclick="setFeature('Lesson')">
        📚 Lesson
    </button>

    <button onclick="loadQuiz()">
        🧠 Quiz
    </button>

    <button onclick="loadProgress()">
        📊 Progress
    </button>

</section>


<!-- Current Feature -->

<div class="status">

    Current mode:
    <b id="feature">Conversation</b>

</div>


<!-- Chat -->

<section id="chatbox" class="chatbox">

    <div class="bot">
        🤖 Hello! Choose your language and level,
        then start learning.
    </div>

</section>


<!-- Message Input
